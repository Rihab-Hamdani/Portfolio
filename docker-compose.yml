# Full stack: PostgreSQL + Spring Boot API + React (served by nginx, which also proxies /api).
#   cp .env.example .env   # then edit the values
#   docker compose up --build
# Open http://localhost:3000  (admin: http://localhost:3000/admin)

name: rihab-portfolio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-portfolio}
      DB_USERNAME: ${POSTGRES_USER:-portfolio}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Rihab Hamdani}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SITE_URL: ${SITE_URL:-}
      # nginx sets X-Forwarded-For itself, so it can be trusted for rate limiting
      TRUST_FORWARDED_HEADERS: "true"
      RATE_LIMIT_CONTACT_PER_HOUR: ${RATE_LIMIT_CONTACT_PER_HOUR:-5}
      RATE_LIMIT_LOGIN_PER_15_MIN: ${RATE_LIMIT_LOGIN_PER_15_MIN:-10}
      RATE_LIMIT_ANALYTICS_PER_MIN: ${RATE_LIMIT_ANALYTICS_PER_MIN:-60}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SITE_URL: ${SITE_URL:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_LINKEDIN_URL: ${VITE_LINKEDIN_URL:-}
        VITE_EMAIL: ${VITE_EMAIL:-}
        VITE_RESUME_URL: ${VITE_RESUME_URL:-/Rihab-Hamdani-CV.pdf}
        VITE_PROFILE_PHOTO: ${VITE_PROFILE_PHOTO:-/images/profile.jpg}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
