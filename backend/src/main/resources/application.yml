server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or alters tables.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  site:
    # Public URL of the frontend (used for absolute links in /sitemap.xml)
    url: ${SITE_URL:}
  jwt:
    # Must be at least 32 characters. Never commit a real value.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: ${JWT_ISSUER:rihab-portfolio}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Rihab Hamdani}
  rate-limit:
    contact-per-hour: ${RATE_LIMIT_CONTACT_PER_HOUR:5}
    login-per-window: ${RATE_LIMIT_LOGIN_PER_15_MIN:10}
    analytics-per-minute: ${RATE_LIMIT_ANALYTICS_PER_MIN:60}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  notifications:
    enabled: ${MAIL_ENABLED:false}
    to: ${MAIL_TO:}
    from: ${MAIL_FROM:}

logging:
  level:
    root: INFO
    com.rihab.portfolio: INFO
